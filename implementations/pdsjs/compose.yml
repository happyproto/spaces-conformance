# pds.js hosts one account per container, so each harness user gets one.
# Both have spaces on: they are HappyView's partners, and its users' PDSes.
x-pdsjs: &pdsjs
  image: ${PDSJS_IMAGE:?set from pins/images.env}
  user: root
  volumes:
    - caddy_data:/caddy-data:ro
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/xrpc/_health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    interval: 2s
    timeout: 3s
    retries: 30
  depends_on:
    plc:
      condition: service_started

x-pdsjs-env: &pdsjs-env
  PORT: "3000"
  PDS_PASSWORD: password123
  PLC_URL: http://plc:2582
  PDS_ENABLE_SPACES: "true"
  NODE_EXTRA_CA_CERTS: /caddy-data/caddy/pki/authorities/local/root.crt

services:
  pdsjs-alice:
    <<: *pdsjs
    environment:
      <<: *pdsjs-env
      PDS_HOSTNAME: pdsjs-alice.test
      JWT_SECRET: conformance-pdsjs-alice-jwt
  pdsjs-bob:
    <<: *pdsjs
    environment:
      <<: *pdsjs-env
      PDS_HOSTNAME: pdsjs-bob.test
      JWT_SECRET: conformance-pdsjs-bob-jwt
