# Seeded from HappyView's interop pins (design ch. 4.6). Each entry is listed
# only once a run confirms it isn't a harness bug. Confirmed against
# PDSJS_IMAGE sha256:1725c1f8d2ce on 2026-11-12.
#
# Each `expect` is the failure the 2026-11-12 parity run recorded
# (test/fixtures/results/parity-pdsjs-2026-11-12.json). Patterns match the
# whole value. Any other failure on the same assertion is "deviation changed",
# which fails the run.

# One cause: how space record values are encoded (pds.js#4).
- assertion: digest.cid-drisl-typed
  cause: space-record-encoding
  reason: >-
    createRecord and getRecord return CIDs that differ from DRISL for all four typed
    fixture records: a $link, a $bytes, and integers past 32 bits. Plain-JSON records
    match.
  spec: "#commit-digest"
  tracking: https://tangled.org/chadtmiller.com/pds.js/issues/4
  since: "2026-11-12"
  expect:
    message: 4 record CID\(s\) differ from DRISL
    # All four typed fixtures, in fixture order, each wrong on both createRecord and getRecord.
    evidence:
      mismatches: >-
        \[\{"record":"link",[^{}]*"getRecord":"bafy[^"]+"\},\{"record":"bytes",[^{}]*"getRecord":"bafy[^"]+"\},\{"record":"bigint",[^{}]*"getRecord":"bafy[^"]+"\},\{"record":"int32edge",[^{}]*"getRecord":"bafy[^"]+"\}\]

# One cause: listRepoOps doesn't follow cursor (pds.js#5).
- assertion: oplog.pagination-complete
  cause: oplog-cursor-ignored
  reason: >-
    listRepoOps ignores cursor, so following it repeats the first page. The lexicon
    says cursor takes precedence over since.
  spec: "#incremental-sync"
  tracking: https://tangled.org/chadtmiller.com/pds.js/issues/5
  since: "2026-11-12"
  expect:
    message: following cursor with limit=2 returned p0 2 times, not once
    evidence:
      pages: \[2,2\]
- assertion: oplog.pagination-batch-boundary
  cause: oplog-cursor-ignored
  reason: >-
    Paging with limit=2 across one three-op applyWrites batch, following cursor,
    returned m1, m2, m1, m2: the first page twice, and m3 never.
  spec: "#incremental-sync"
  tracking: https://tangled.org/chadtmiller.com/pds.js/issues/5
  since: "2026-11-12"
  expect:
    message: "a page boundary inside one applyWrites batch lost ops: got \\[m1, m1, m2, m2\\]"
    evidence:
      pages: \[2,2\]
