id: pdsjs
name: pds.js
source: https://tangled.org/chadtmiller.com/pds.js
image:
  repository: ghcr.io/happyproto/pds-test/pdsjs
  pin: PDSJS_IMAGE
  dispatch_target: pdsjs
spec_revision: "2026-10-29"
roles: [pds, repo-host, space-host]
profile: pds
capabilities:
  # The spec's baseline: every PDS must serve these (#baseline-policies).
  # At the Nov 2026 pin it serves none of the Oct 29 memberspace methods.
  policies: [personalspace, memberspace, managedspace]
  repo_host:
    foreign_authorities: true
  oauth:
    # The consent form takes the account password and returns JSON.
    scripted: true
# Per area, from the pinned image's own source (/app, revision ae6afc78):
# @pdsjs/core has no dependencies, and every area is pds.js's own code.
#   cbor    packages/core/src (cborEncodeDagCbor)
#   lthash  packages/spaces/src/lthash.js, with its own blake3.js
#   mac     packages/spaces/src/mac.js
#   httpsig packages/spaces/src/http-signature.js
#   jwt     packages/spaces/src/token.js
#   star    none: getRepo serves a CAR (packages/spaces/src/car.js), so unknown
lineage: { cbor: pdsjs, lthash: pdsjs, mac: pdsjs, httpsig: pdsjs, jwt: pdsjs }
compose: compose.yml
base_url: http://pdsjs-alice.test
health: /xrpc/_health
accounts:
  # One account per container: did:plc genesis, then POST /init.
  mode: custom
  # The today rows use a password session (createSession, then Bearer), as
  # HappyView's pds.js interop tests do. OAuth with DPoP is scripted and
  # tested (test/stack/oauth.stack.test.ts); the scope suites use it (phase 7).
  write_auth: password-session
spaces:
  authority: account
  # Setup only (ungraded). The pinned image serves only the Oct 22
  # simplespace.createSpace; cli/run.ts --setup-mode picks another mode.
  create: simplespace
  modes: [oct29, simplespace, auto]
setup: adapter.ts
deviations: deviations.yaml
quirks:
  single_account: true
  # Builds its OAuth issuer from the socket scheme, so it is served over http.
  http_only_behind_proxy: true
