id: zds
name: ZDS
source: https://tangled.org/zat.dev/zds
image:
  repository: ghcr.io/happyproto/pds-test/zds
  pin: ZDS_IMAGE
  dispatch_target: zds
spec_revisions: ["2026-11-12"]
roles: [pds, repo-host, space-host]
profile: pds
capabilities:
  # The spec's baseline: every PDS must serve these (#baseline-policies).
  # At the Nov 2026 pin it serves none of the Oct 29 memberspace methods.
  policies: [personalspace, memberspace, managedspace]
  repo_host:
    foreign_authorities: true
  oauth:
    scripted: false
# Per area, at the pinned image's revision d660f467 (zat.dev/zds), with zat v0.4.4:
#   cbor    zat: src/internal/permissioned_data.zig encodes and hashes records with zat.cbor
#   lthash  zds: permissioned_data.zig defines LtHash itself (std Blake3)
#   mac     zds: permissioned_data.zig commitMac (std HKDF and HMAC)
#   httpsig zds: src/internal/space_signature.zig builds and checks the signature base
#   jwt     zds: permissioned_data.zig parseAndVerifyJwt does the space-JWT checks, with
#           only the ES256 signature check from zat.jwt (service auth is zat's)
#   star    none: getRepo serves a CAR (zat.car), so unknown
lineage: { cbor: zat, lthash: zds, mac: zds, httpsig: zds, jwt: zds }
compose: compose.yml
base_url: https://zds.test
health: /xrpc/_health
accounts:
  mode: create-account
  write_auth: password-session
spaces:
  authority: account
  # Setup only (ungraded). The pinned image serves only the Oct 22
  # simplespace.createSpace; cli/run.ts --setup-mode picks another mode.
  create: oct29
  modes: [oct29, simplespace, auto]
setup: adapter.ts
deviations: deviations.yaml
