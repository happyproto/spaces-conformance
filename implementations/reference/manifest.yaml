id: reference
name: Bluesky reference PDS (pds-spaces-alpha)
source: https://github.com/bluesky-social/atproto
image:
  repository: ghcr.io/happyproto/pds-test/pds-spaces-alpha
  pin: PDS_SPACES_ALPHA_IMAGE
  dispatch_target: pds-spaces-alpha
  platforms: [linux/amd64]
# At the HAP-427 pin (atproto b27a037c) the image's space lexicons equal the
# 2026-11-12 set (d4def6e9), so it claims that revision. Graded at
# 2026-10-29 it fails only the three policy rows, whose methods that revision
# names differently.
spec_revisions: ["2026-11-12"]
roles: [pds, repo-host, space-host]
profile: pds
capabilities:
  # Every PDS must serve the three baseline policies (#baseline-policies), so
  # the reference is graded on them like the other PDSes. The Nov 13 pin
  # (HAP-427, atproto b27a037c) ships space.createSpace and the memberspace
  # putMembers, removeMembers and listMembers handlers, and no simplespace.
  # It hasn't run on this suite yet: this Mac can't emulate amd64 right now.
  policies: [personalspace, memberspace, managedspace]
  repo_host:
    foreign_authorities: true
  oauth:
    scripted: false
# Per area, the code that implements it in the pinned image, built from
# bluesky-social/atproto at b27a037c (the image's revision label), read from
# the image's built packages:
#   cbor    @atproto/lex-cbor: packages/pds/src/actor-store/space/transactor.ts imports its encode
#   lthash  @atproto/space: packages/space/src/lthash.ts (blake3 from @noble/hashes), repo-commit.ts
#   mac     @atproto/space: packages/space/src/mac.ts (primitives from @atproto/crypto)
#   httpsig @atproto/space: packages/space/src/http-signature.ts (structured-headers)
#   jwt     @atproto/space: packages/space/src/credential.ts parses and signs the JWTs
#   star    @atproto/star: packages/space/src/sync/provider.ts writes getRepo's STAR with it
lineage: { cbor: "@atproto/lex-cbor", lthash: "@atproto/space", mac: "@atproto/space", httpsig: "@atproto/space", jwt: "@atproto/space", star: "@atproto/star" }
compose: compose.yml
base_url: https://reference.test
health: /xrpc/_health
accounts:
  mode: create-account
  write_auth: password-session
spaces:
  authority: account
  # Setup only (ungraded). Since the HAP-427 pin the image ships the Oct 29
  # createSpace and no simplespace; cli/run.ts --setup-mode picks another mode.
  create: oct29
  modes: [oct29, simplespace, auto]
setup: adapter.ts
deviations: deviations.yaml
