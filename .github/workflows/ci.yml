name: CI

# Actions are pinned by commit SHA; the comment names the release.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    # RUNNER_AMD64 is unset, so this is GitHub's ephemeral runner. It must never
    # point at a persistent self-hosted runner: this workflow runs on fork PRs.
    runs-on: ${{ vars.RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      # The pinned proposal text, fetched by commit and checked by SHA-256.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/spec
          key: spec-${{ hashFiles('spec/revisions.json') }}

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Validate catalogue, manifests, deviations and results
        run: bun run validate

      - name: Compose fragments assemble
        run: >
          docker compose --env-file pins/images.env
          -f implementations/base.compose.yml
          -f implementations/happyview/compose.yml
          -f implementations/pdsjs/compose.yml
          -f implementations/zds/compose.yml
          config -q
